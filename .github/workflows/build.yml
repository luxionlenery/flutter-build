name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
        type: string
      app_name:
        required: true
        type: string
      build_tag:
        required: true
        type: string
      owner_uid:
        required: false
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool zipalign wget unzip

      - name: Download & Extract ZIP
        run: |
          mkdir -p source
          wget -q -O source.zip "${{ github.event.inputs.zip_url }}"
          unzip -q source.zip -d source/
          echo "── Isi source/ ──"
          ls -la source/

      - name: Cek Base
        run: |
          if [ -f "source/apktool.yml" ]; then
            echo "✓ apktool.yml ketemu, build pake apktool b"
            echo "MODE=apktool" >> $GITHUB_ENV
          elif [ -f "source/AndroidManifest.xml" ]; then
            echo "✓ AndroidManifest.xml ketemu, coba apktool b dari parent"
            cd source
            if [ -d "smali" ] || [ -d "res" ]; then
              echo "MODE=apktool" >> $GITHUB_ENV
            else
              echo "✗ Isi ZIP bukan hasil apktool d"
              exit 1
            fi
          else
            echo "✗ NGGAK ADA apktool.yml atau AndroidManifest.xml di ZIP!"
            echo "── Isi ZIP lu: ──"
            find source -type f | head -30
            exit 1
          fi

      - name: Build APK (apktool)
        if: env.MODE == 'apktool'
        run: |
          cd source
          echo "── Running apktool b ──"
          apktool b -o ../unsigned.apk 2>&1 || {
            echo "✗ APKTOOL BUILD GAGAL!"
            echo "── Isi folder ──"
            ls -la
            exit 1
          }
          cd ..
          echo "── Hasil build ──"
          ls -la unsigned.apk

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>&1 | tail -3

      - name: Zipalign & Sign
        run: |
          BUILD_TOOLS=$(ls -d /usr/lib/android-sdk/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BUILD_TOOLS" ]; then
            BUILD_TOOLS=$(find / -name "zipalign" -type f 2>/dev/null | head -1 | xargs dirname)
          fi
          echo "Using build-tools: $BUILD_TOOLS"
          
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr -cd 'A-Za-z0-9_-')
          [ -z "$SAFE_NAME" ] && SAFE_NAME="app"
          OUTPUT_NAME="${SAFE_NAME}.apk"

          $BUILD_TOOLS/zipalign -v 4 unsigned.apk aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT_NAME" \
            aligned.apk

          echo "OUTPUT_APK=$OUTPUT_NAME" >> $GITHUB_ENV
          ls -la "$OUTPUT_NAME"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.build_tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" "$OUTPUT_APK" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$OUTPUT_APK" --title "$TAG" --notes "Auto-built" --repo "${{ github.repository }}"
          fi
