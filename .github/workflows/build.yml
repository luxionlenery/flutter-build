name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
        type: string
      app_name:
        required: true
        type: string
      build_tag:
        required: true
        type: string
      owner_uid:
        required: false
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          
          wget -q --timeout=60 --tries=3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34" 2>&1 | tail -5
          
          echo "── Verifikasi build-tools ──"
          ls -la $ANDROID_HOME/build-tools/ || echo "✗ build-tools KOSONG!"
          
          echo "── Verifikasi zipalign ──"
          find $ANDROID_HOME -name "zipalign" -type f 2>/dev/null || echo "✗ zipalign nggak ketemu!"
          
          echo "── Verifikasi apksigner ──"
          find $ANDROID_HOME -name "apksigner" -type f 2>/dev/null || echo "✗ apksigner nggak ketemu!"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Download & Extract ZIP
        run: |
          mkdir -p source
          wget -q -O source.zip "${{ github.event.inputs.zip_url }}"
          unzip -q source.zip -d source/
          echo "── Isi source/ ──"
          find source -type f | head -50

      - name: HAPUS REFERENSI ICON DI MANIFEST
        run: |
          WORKSPACE="$GITHUB_WORKSPACE"
          echo "════════════════════════════════════════"
          echo "  HAPUS REFERENSI ICON"
          echo "════════════════════════════════════════"
          
          MANIFEST=$(find "$WORKSPACE/source" -name "AndroidManifest.xml" -type f | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "✗ AndroidManifest.xml nggak ketemu!"
            exit 1
          fi
          echo "✓ Manifest: $MANIFEST"
          
          echo "── Sebelum dibersihin ──"
          grep -n "icon\|roundIcon\|logo\|banner" "$MANIFEST" || echo "(nggak ada referensi icon)"
          
          sed -i 's/[[:space:]]*android:icon="[^"]*"//g' "$MANIFEST"
          sed -i 's/[[:space:]]*android:roundIcon="[^"]*"//g' "$MANIFEST"
          sed -i 's/[[:space:]]*android:logo="[^"]*"//g' "$MANIFEST"
          sed -i 's/[[:space:]]*android:banner="[^"]*"//g' "$MANIFEST"
          
          echo "── Sesudah dibersihin ──"
          grep -n "icon\|roundIcon\|logo\|banner" "$MANIFEST" || echo "(✅ semua referensi icon udah dihapus)"
          echo "✓ SELESAI"

      - name: BUILD APK
        run: |
          echo "════════════════════════════════════════"
          echo "  BUILD APK"
          echo "════════════════════════════════════════"
          
          WORKSPACE="$GITHUB_WORKSPACE"
          
          GRADLE_FILE=$(find "$WORKSPACE/source" -name "build.gradle" -o -name "build.gradle.kts" | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "✗ build.gradle nggak ketemu!"
            find "$WORKSPACE/source" -type f | head -30
            exit 1
          fi
          
          GRADLE_DIR=$(dirname "$GRADLE_FILE")
          echo "✓ Gradle dir: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "── Bikin settings.gradle ──"
            echo "include ':app'" > settings.gradle
            echo "rootProject.name = 'app'" >> settings.gradle
          fi
          
          echo "── Running gradle assembleDebug ──"
          gradle assembleDebug --no-daemon 2>&1 | tail -50
          
          APK_RESULT=$(find "$GRADLE_DIR" -name "*.apk" -path "*/build/outputs/*" | head -1)
          if [ -z "$APK_RESULT" ]; then
            APK_RESULT=$(find "$GRADLE_DIR" -name "*.apk" -type f | head -1)
          fi
          
          if [ -z "$APK_RESULT" ]; then
            echo "✗ APK nggak ketemu!"
            find "$GRADLE_DIR" -name "*.apk" 2>/dev/null
            exit 1
          fi
          
          echo "✓ APK: $APK_RESULT"
          cp "$APK_RESULT" "$WORKSPACE/unsigned.apk"
          ls -la "$WORKSPACE/unsigned.apk"

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>&1 | tail -3

      - name: Zipalign & Sign
        run: |
          echo "════════════════════════════════════════"
          echo "  ZIPALIGN & SIGN"
          echo "════════════════════════════════════════"
          
          echo "── Cari build-tools ──"
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -1)
          if [ -z "$BUILD_TOOLS" ]; then
            echo "✗ build-tools KOSONG! Cari zipalign & apksigner manual..."
            ZIPALIGN=$(find $ANDROID_HOME -name "zipalign" -type f 2>/dev/null | head -1)
            APKSIGNER=$(find $ANDROID_HOME -name "apksigner" -type f 2>/dev/null | head -1)
            echo "zipalign: $ZIPALIGN"
            echo "apksigner: $APKSIGNER"
          else
            echo "✓ BUILD_TOOLS: $BUILD_TOOLS"
            ZIPALIGN="$BUILD_TOOLS/zipalign"
            APKSIGNER="$BUILD_TOOLS/apksigner"
          fi
          
          if [ ! -f "$ZIPALIGN" ]; then
            echo "✗ zipalign nggak ketemu! Install ulang..."
            sdkmanager "build-tools;34.0.0" 2>&1 | tail -5
            BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -1)
            ZIPALIGN="$BUILD_TOOLS/zipalign"
            APKSIGNER="$BUILD_TOOLS/apksigner"
          fi
          
          if [ ! -f "$ZIPALIGN" ]; then
            echo "✗ ZIPALIGN TETEP NGGAK KETEMU!"
            find $ANDROID_HOME -name "*align*" 2>/dev/null
            exit 1
          fi
          
          echo "✓ zipalign: $ZIPALIGN"
          echo "✓ apksigner: $APKSIGNER"
          
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr -cd 'A-Za-z0-9_-')
          [ -z "$SAFE_NAME" ] && SAFE_NAME="app"
          OUTPUT_NAME="${SAFE_NAME}.apk"
          
          echo "── Zipalign ──"
          "$ZIPALIGN" -v 4 unsigned.apk aligned.apk
          
          echo "── Sign ──"
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT_NAME" \
            aligned.apk
          
          echo "OUTPUT_APK=$OUTPUT_NAME" >> $GITHUB_ENV
          ls -la "$OUTPUT_NAME"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.build_tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" "$OUTPUT_APK" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$OUTPUT_APK" --title "$TAG" --notes "Auto-built" --repo "${{ github.repository }}"
          fi
