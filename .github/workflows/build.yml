name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
        type: string
      app_name:
        required: true
        type: string
      build_tag:
        required: true
        type: string
      owner_uid:
        required: false
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          
          wget -q --timeout=60 --tries=3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O cmdline-tools.zip
          
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34" 2>&1 | tail -5

      - name: Download & Extract ZIP
        run: |
          mkdir -p source
          wget -q -O source.zip "${{ github.event.inputs.zip_url }}"
          unzip -q source.zip -d source/
          echo "── Isi source/ ──"
          ls -la source/

      - name: Cari Project Root
        run: |
          # Cari folder yang ada build.gradle
          PROJECT_ROOT=""
          if [ -f "source/build.gradle" ]; then
            PROJECT_ROOT="source"
          elif [ -f "source/android/build.gradle" ]; then
            PROJECT_ROOT="source/android"
          else
            # Cari build.gradle di mana aja
            GRADLE_FILE=$(find source -name "build.gradle" -type f | head -1)
            if [ -n "$GRADLE_FILE" ]; then
              PROJECT_ROOT=$(dirname "$GRADLE_FILE")
            fi
          fi
          
          if [ -z "$PROJECT_ROOT" ]; then
            echo "✗ NGGAK ADA build.gradle di ZIP!"
            find source -type f | head -30
            exit 1
          fi
          
          echo "✓ Project root: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Build APK (Gradle)
        run: |
          cd ${{ env.PROJECT_ROOT }}
          chmod +x gradlew || true
          
          echo "── Running gradlew assembleDebug ──"
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -50 || {
            echo "✗ GRADLE BUILD GAGAL!"
            exit 1
          }
          
          # Cari APK hasil build
          APK_FILE=$(find . -name "*.apk" -path "*/build/outputs/*" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "✗ APK hasil build nggak ketemu!"
            find . -name "*.apk" 2>/dev/null
            exit 1
          fi
          
          echo "✓ APK: $APK_FILE"
          cp "$APK_FILE" $GITHUB_WORKSPACE/unsigned.apk

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>&1 | tail -3

      - name: Zipalign & Sign
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr -cd 'A-Za-z0-9_-')
          [ -z "$SAFE_NAME" ] && SAFE_NAME="app"
          OUTPUT_NAME="${SAFE_NAME}.apk"
          
          $BUILD_TOOLS/zipalign -v 4 unsigned.apk aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT_NAME" \
            aligned.apk
          
          echo "OUTPUT_APK=$OUTPUT_NAME" >> $GITHUB_ENV
          ls -la "$OUTPUT_NAME"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.build_tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" "$OUTPUT_APK" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$OUTPUT_APK" --title "$TAG" --notes "Auto-built" --repo "${{ github.repository }}"
          fi
