name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
        type: string
      app_name:
        required: true
        type: string
      build_tag:
        required: true
        type: string
      owner_uid:
        required: false
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q --timeout=60 --tries=3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34" 2>&1 | tail -3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Install apktool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool zipalign wget unzip

      - name: Download & Extract ZIP
        run: |
          mkdir -p source
          wget -q -O source.zip "${{ github.event.inputs.zip_url }}"
          unzip -q source.zip -d source/
          echo "── Isi source/ ──"
          find source -type f | head -40

      - name: AUTO-DETECT & BUILD
        run: |
          echo "════════════════════════════════════════"
          echo "  AUTO-DETECT MODE"
          echo "════════════════════════════════════════"
          
          WORKSPACE="$GITHUB_WORKSPACE"
          echo "Workspace: $WORKSPACE"
          ls -la "$WORKSPACE/source/" | head -10
          
          # MODE 1: APK mentah
          APK_FILE=$(find "$WORKSPACE/source" -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            echo "✓ MODE 1: Ketemu APK mentah: $APK_FILE"
            cp "$APK_FILE" "$WORKSPACE/unsigned.apk"
            ls -la "$WORKSPACE/unsigned.apk"
            exit 0
          fi
          
          # MODE 2: apktool
          APKTOOL_YML=$(find "$WORKSPACE/source" -name "apktool.yml" -type f | head -1)
          if [ -n "$APKTOOL_YML" ]; then
            echo "✓ MODE 2: Ketemu apktool.yml: $APKTOOL_YML"
            APKTOOL_DIR=$(dirname "$APKTOOL_YML")
            cd "$APKTOOL_DIR"
            apktool b -o "$WORKSPACE/unsigned.apk" 2>&1 | tail -20
            cd "$WORKSPACE"
            if [ -f "$WORKSPACE/unsigned.apk" ]; then
              echo "✓ apktool b sukses"
              ls -la "$WORKSPACE/unsigned.apk"
              exit 0
            fi
          fi
          
          # MODE 3: Gradle
          GRADLE_FILE=$(find "$WORKSPACE/source" -name "build.gradle" -o -name "build.gradle.kts" | head -1)
          if [ -n "$GRADLE_FILE" ]; then
            echo "✓ MODE 3: Ketemu build.gradle: $GRADLE_FILE"
            GRADLE_DIR=$(dirname "$GRADLE_FILE")
            cd "$GRADLE_DIR"
            
            # Kalau gradle-wrapper.jar nggak ada, pake gradle global
            if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "── Pake gradlew ──"
              chmod +x gradlew
              ./gradlew assembleDebug --no-daemon 2>&1 | tail -40
            else
              echo "── Wrapper nggak ada, pake gradle global ──"
              # Bikin settings.gradle kalau nggak ada
              if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
                echo "── Bikin settings.gradle otomatis ──"
                echo "include ':app'" > settings.gradle
                echo "rootProject.name = 'app'" >> settings.gradle
              fi
              gradle assembleDebug --no-daemon 2>&1 | tail -40
            fi
            
            APK_RESULT=$(find "$GRADLE_DIR" -name "*.apk" -path "*/build/outputs/*" | head -1)
            if [ -z "$APK_RESULT" ]; then
              APK_RESULT=$(find "$GRADLE_DIR" -name "*.apk" -type f | head -1)
            fi
            
            if [ -n "$APK_RESULT" ]; then
              echo "✓ Gradle build sukses: $APK_RESULT"
              cp "$APK_RESULT" "$WORKSPACE/unsigned.apk"
              cd "$WORKSPACE"
              ls -la "$WORKSPACE/unsigned.apk"
              exit 0
            else
              echo "✗ Gradle build gagal, APK nggak ketemu"
              find "$GRADLE_DIR" -name "*.apk" 2>/dev/null
              cd "$WORKSPACE"
            fi
          fi
          
          # MODE 4: Cari APK di mana aja
          echo "── MODE 4: Cari APK di mana aja ──"
          ANY_APK=$(find "$WORKSPACE" -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$ANY_APK" ]; then
            echo "✓ Ketemu: $ANY_APK"
            cp "$ANY_APK" "$WORKSPACE/unsigned.apk"
            ls -la "$WORKSPACE/unsigned.apk"
            exit 0
          fi
          
          echo "✗ SEMUA MODE GAGAL! Isi ZIP lu:"
          find "$WORKSPACE/source" -type f 2>/dev/null | head -50
          exit 1

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>&1 | tail -3

      - name: Zipalign & Sign
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr -cd 'A-Za-z0-9_-')
          [ -z "$SAFE_NAME" ] && SAFE_NAME="app"
          OUTPUT_NAME="${SAFE_NAME}.apk"
          $BUILD_TOOLS/zipalign -v 4 unsigned.apk aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT_NAME" \
            aligned.apk
          echo "OUTPUT_APK=$OUTPUT_NAME" >> $GITHUB_ENV
          ls -la "$OUTPUT_NAME"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.build_tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" "$OUTPUT_APK" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$OUTPUT_APK" --title "$TAG" --notes "Auto-built" --repo "${{ github.repository }}"
          fi
