name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
        type: string
      app_name:
        required: true
        type: string
      build_tag:
        required: true
        type: string
      owner_uid:
        required: false
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
  run: |
    echo "── Setup Android SDK ──"
    export ANDROID_HOME=$HOME/android-sdk
    mkdir -p $ANDROID_HOME/cmdline-tools
    cd $ANDROID_HOME/cmdline-tools
    
    # Coba download dari Google, kalau gagal retry
    for i in 1 2 3; do
      echo "── Attempt $i ──"
      wget -q --timeout=60 --tries=3 \
        "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
        -O cmdline-tools.zip && break
      echo "Gagal, retry..."
      sleep 5
    done
    
    if [ ! -f cmdline-tools.zip ]; then
      echo "✗ GAGAL DOWNLOAD Android SDK setelah 3x coba"
      exit 1
    fi
    
    unzip -q cmdline-tools.zip
    mv cmdline-tools latest
    
    export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
    echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
    echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
    echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
    echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
    
    # Install build-tools & platform
    yes | sdkmanager --licenses > /dev/null 2>&1 || true
    sdkmanager "build-tools;34.0.0" "platforms;android-34" 2>&1 | tail -5
    
    echo "✓ Android SDK ready"
    ls -la $ANDROID_HOME/build-tools/ || true

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zipalign wget unzip

      - name: Download & Extract
        run: |
          mkdir -p source
          wget -q -O source.zip "${{ github.event.inputs.zip_url }}"
          unzip -q source.zip -d source/
          echo "── Isi source/ ──"
          ls -la source/

      - name: Cari APK
        run: |
          APK_FILE=$(find source -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "✗ NGGAK ADA FILE .APK DI DALEM ZIP!"
            echo "── Isi ZIP lu: ──"
            find source -type f | head -30
            exit 1
          fi
          echo "✓ Ketemu APK: $APK_FILE"
          cp "$APK_FILE" unsigned.apk

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>&1 | tail -3

      - name: Zipalign & Sign
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr -cd 'A-Za-z0-9_-')
          [ -z "$SAFE_NAME" ] && SAFE_NAME="app"
          OUTPUT_NAME="${SAFE_NAME}.apk"

          $BUILD_TOOLS/zipalign -v 4 unsigned.apk aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT_NAME" \
            aligned.apk

          echo "OUTPUT_APK=$OUTPUT_NAME" >> $GITHUB_ENV
          ls -la "$OUTPUT_NAME"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.build_tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" "$OUTPUT_APK" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$OUTPUT_APK" --title "$TAG" --notes "Auto-built" --repo "${{ github.repository }}"
          fi
